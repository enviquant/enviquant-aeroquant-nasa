services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1883", "-t", "aeroquant/health", "-m", "ping", "-q", "0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      WS_PORT: "8071"
    expose:
      - "8071"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8071/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_DASHBOARD_PASSWORD: ${REACT_APP_DASHBOARD_PASSWORD:-}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:-}
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8071"

volumes:
  mosquitto-data:
  mosquitto-log:
